<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HCSiG - Hacking Code Simulator Game</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>

  <header id="header">
    <div class="header-left">
      <h1>HCSiG</h1>
      <span class="header-version">v1.6.7.2 (Web)</span>
    </div>
    <div class="header-right">
      <span class="subtitle">Hacking Code Simulator Game</span>
      <button id="btnMore">더보기 ▾</button>
    </div>
  </header>

  <main id="main">
    <section id="leftPanel" class="panel">
      <h2>Status</h2>
      <div id="statusArea"></div>
    </section>

    <section id="centerPanel" class="panel">
      <h2>Actions</h2>
      <div id="actionArea"></div>
    </section>

    <section id="rightPanel" class="panel">
      <h2>Shop</h2>
      <div id="shopArea"></div>
    </section>
  </main>

  <footer id="footer">
    <span>© HCSiG</span>
  </footer>

  <script src="./js/app.js"></script>
</body>
</html>
