<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HCSiG - Hacking Code Simulator Game</title>

  <!-- ✅ repo root 기준 -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- ✅ app.js가 기대하는 헤더/버튼 id 유지 -->
  <header id="header">
    <div class="header-left">
      <h1>HCSiG</h1>
      <span class="header-version">v1.6.9.0 (Web)</span>
    </div>

    <div class="header-right">
      <span class="subtitle">Hacking Code Simulator Game</span>
      <button id="btnMore" title="업데이트 로그, 미션, 업적, 저장/불러오기">더보기 ▾</button>
    </div>
  </header>

  <!-- ✅ app.js가 패널/영역을 찾을 수 있도록 id를 '원래대로' 맞춤 -->
  <div id="main">
    <section id="leftPanel" class="panel">
      <div class="section-title">Status</div>
      <div id="statusArea"></div>
    </section>

    <section id="centerPanel" class="panel">
      <div class="section-title">Actions</div>
      <div id="actionArea"></div>
    </section>

    <section id="rightPanel" class="panel">
      <div class="section-title">Shop</div>
      <div id="shopArea"></div>
    </section>
  </div>

  <footer id="footer">
    <span>© HCSiG</span>
  </footer>

  <!-- ✅ repo root 기준 -->
  <script src="./app.js"></script>
</body>
</html>
