  <circle cx="384" cy="330" r="186" fill="none" stroke="#A855FF" stroke-width="8" opacity=".22"/>
  <g filter="url(#glow)" stroke-linecap="round" stroke-linejoin="round">
<path d="M246 246 C278 188 490 188 522 246 V350 C522 438 454 488 384 488 C314 488 246 438 246 350 Z" fill="none" stroke="#A855FF" stroke-width="28"/><path d="M308 318 H354 M414 318 H460" stroke="#EAFBFF" stroke-width="24"/><path d="M338 398 C362 422 406 422 430 398" stroke="#EAFBFF" stroke-width="20" fill="none"/>
