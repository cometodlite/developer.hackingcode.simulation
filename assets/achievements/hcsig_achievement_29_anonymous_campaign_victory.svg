    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="#12303A" stroke-width="1" opacity=".24"/>
    </pattern>
  </defs>
  <rect width="768" height="768" rx="156" fill="url(#bg)"/>
  <rect width="768" height="768" rx="156" fill="url(#grid)" opacity=".55"/>
  <rect x="72" y="72" width="624" height="624" rx="124" fill="#0B1B22" opacity=".65" stroke="#A855FF" stroke-width="8"/>
