<rect x="246" y="244" width="276" height="228" rx="34" fill="none" stroke="#FFD166" stroke-width="26"/><path d="M246 310 H522" stroke="#FFD166" stroke-width="22"/><path d="M306 212 L346 256 L384 198 L422 256 L462 212 L452 284 H316 Z" fill="none" stroke="#FFD166" stroke-width="24"/><path d="M328 400 L368 438 L452 350" fill="none" stroke="#EAFBFF" stroke-width="26"/>
