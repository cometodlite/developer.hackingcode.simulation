<rect x="236" y="244" width="296" height="202" rx="36" fill="none" stroke="#FFD166" stroke-width="30"/><path d="M236 306 H532 M384 244 V446" stroke="#FFD166" stroke-width="24"/><path d="M310 244 C270 204 292 168 332 180 C366 190 378 224 384 244 C390 224 402 190 436 180 C476 168 498 204 458 244" fill="none" stroke="#FFD166" stroke-width="24"/>
