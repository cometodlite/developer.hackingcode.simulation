<circle cx="384" cy="330" r="58" fill="none" stroke="#EAFBFF" stroke-width="26"/><circle cx="260" cy="230" r="42" fill="none" stroke="#4DA3FF" stroke-width="24"/><circle cx="508" cy="230" r="42" fill="none" stroke="#4DA3FF" stroke-width="24"/><circle cx="260" cy="430" r="42" fill="none" stroke="#4DA3FF" stroke-width="24"/><circle cx="508" cy="430" r="42" fill="none" stroke="#4DA3FF" stroke-width="24"/><path d="M304 258 L340 300 M464 258 L428 300 M304 402 L340 360 M464 402 L428 360" stroke="#4DA3FF" stroke-width="20"/>
