<path d="M224 250 V190 H284 M484 250 V190 H424 M224 410 V470 H284 M484 410 V470 H424" fill="none" stroke="#00F5FF" stroke-width="30"/><rect x="298" y="262" width="112" height="112" rx="20" fill="none" stroke="#EAFBFF" stroke-width="24"/><path d="M250 336 H458" stroke="#7CFF6B" stroke-width="24"/>
