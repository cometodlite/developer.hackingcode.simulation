<svg xmlns="http://www.w3.org/2000/svg" width="768" height="768" viewBox="0 0 768 768" role="img" aria-label="코드 강화">
  <defs>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4.2" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.6588235294117647 0 0 0 0 0.3333333333333333 0 0 0 0 1.0 0 0 0 .70 0" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061014"/>
      <stop offset="100%" stop-color="#0E2730"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="#12303A" stroke-width="1" opacity=".24"/>
    </pattern>
  </defs>
  <rect width="768" height="768" rx="156" fill="url(#bg)"/>
  <rect width="768" height="768" rx="156" fill="url(#grid)" opacity=".55"/>
  <rect x="72" y="72" width="624" height="624" rx="124" fill="#0B1B22" opacity=".65" stroke="#A855FF" stroke-width="8"/>
  <path d="M120 166 H236 M532 602 H648 M122 602 H190 M576 166 H648" stroke="#A855FF" stroke-width="10" stroke-linecap="round" opacity=".55"/>
  <circle cx="384" cy="330" r="186" fill="none" stroke="#A855FF" stroke-width="8" opacity=".22"/>
  <g filter="url(#glow)" stroke-linecap="round" stroke-linejoin="round">
<path d="M384 168 L504 312 H438 V492 H330 V312 H264 Z" fill="none" stroke="#A855FF" stroke-width="34"/><path d="M246 530 H522" stroke="#EAFBFF" stroke-width="24"/>
  </g>
  <text x="384" y="604" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="900" fill="#EAFBFF" letter-spacing="3">UP</text>
  <text x="384" y="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#A855FF" opacity=".92">코드 강화</text>
</svg>